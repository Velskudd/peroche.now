name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Compiler et tester
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Restaurer
        run: dotnet restore PerocheNow.slnx

      - name: Compiler
        run: dotnet build PerocheNow.slnx -c Release --no-restore

      - name: Tester
        run: dotnet test PerocheNow.slnx -c Release --no-build --logger "console;verbosity=normal"

  sonar:
    name: Analyse SonarCloud
    # Ne bloque pas le déploiement : le résultat (quality gate, couverture) se lit sur SonarCloud.
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # Les noms des variables GitHub (SONAR_ORGANISATION, SONAR_PROJET) restent ceux déclarés dans les réglages du dépôt.
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANISATION || 'velskudd' }}
      SONAR_PROJECT: ${{ vars.SONAR_PROJET || 'Velskudd_peroche.now' }}
    steps:
      - name: Vérifier la configuration
        id: config
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::notice::Secret SONAR_TOKEN absent : analyse SonarCloud ignorée (voir README)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.config.outputs.enabled == 'true'
        with:
          # Historique complet : SonarCloud en a besoin pour attribuer les nouveaux problèmes.
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: steps.config.outputs.enabled == 'true'
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.config.outputs.enabled == 'true'
        with:
          distribution: temurin
          java-version: "21"

      - name: Analyser
        if: steps.config.outputs.enabled == 'true'
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet sonarscanner begin \
            /k:"$SONAR_PROJECT" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.coverage.exclusions="tests/**"
          dotnet build PerocheNow.slnx -c Release
          dotnet test PerocheNow.slnx -c Release --no-build \
            --collect "XPlat Code Coverage;Format=opencover"
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  image:
    name: Publier l'image
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Nom de l'image
        id: name
        # GHCR exige un nom en minuscules.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Déployer sur Azure
    needs: image
    # Les variables et secrets Azure peuvent être définis au niveau du dépôt ou de l'environnement « production ».
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Mettre à jour la Container App
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINERAPP || 'peroche-now' }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ needs.image.outputs.image }}:${{ github.sha }}" \
            --only-show-errors \
            --query "properties.latestRevisionName" -o tsv
