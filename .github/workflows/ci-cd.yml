name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Compiler et tester
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restaurer
        run: dotnet restore PerocheNow.slnx

      - name: Compiler
        run: dotnet build PerocheNow.slnx -c Release --no-restore

      - name: Tester
        run: dotnet test PerocheNow.slnx -c Release --no-build --logger "console;verbosity=normal"

  sonar:
    name: Analyse SonarCloud
    # Ne bloque pas le déploiement : le résultat (quality gate, couverture) se lit sur SonarCloud.
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANISATION: ${{ vars.SONAR_ORGANISATION || 'velskudd' }}
      SONAR_PROJET: ${{ vars.SONAR_PROJET || 'Velskudd_peroche.now' }}
    steps:
      - name: Vérifier la configuration
        id: config
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::notice::Secret SONAR_TOKEN absent : analyse SonarCloud ignorée (voir README)."
            echo "actif=false" >> "$GITHUB_OUTPUT"
          else
            echo "actif=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.actif == 'true'
        with:
          # Historique complet : SonarCloud en a besoin pour attribuer les nouveaux problèmes.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        if: steps.config.outputs.actif == 'true'
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-java@v4
        if: steps.config.outputs.actif == 'true'
        with:
          distribution: temurin
          java-version: "21"

      - name: Analyser
        if: steps.config.outputs.actif == 'true'
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet sonarscanner begin \
            /k:"$SONAR_PROJET" \
            /o:"$SONAR_ORGANISATION" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.coverage.exclusions="tests/**"
          dotnet build PerocheNow.slnx -c Release
          dotnet test PerocheNow.slnx -c Release --no-build \
            --collect "XPlat Code Coverage;Format=opencover"
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  image:
    name: Publier l'image
    needs: verifier
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.nom.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Nom de l'image
        id: nom
        # GHCR exige un nom en minuscules.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.nom.outputs.image }}:${{ github.sha }}
            ${{ steps.nom.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deployer:
    name: Déployer sur Azure
    needs: image
    # Les variables et secrets Azure peuvent être définis au niveau du dépôt ou de l'environnement « production ».
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Mettre à jour la Container App
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINERAPP || 'peroche-now' }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ needs.image.outputs.image }}:${{ github.sha }}" \
            --only-show-errors \
            --query "properties.latestRevisionName" -o tsv
