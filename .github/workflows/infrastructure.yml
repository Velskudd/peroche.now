name: Infrastructure

# Crée ou met à jour les ressources Azure décrites dans infra/main.bicep.
# À lancer à la main : la première fois, puis à chaque modification de l'infrastructure.
on:
  workflow_dispatch:

jobs:
  deployer:
    name: Déployer infra/main.bicep
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Déployer
        env:
          GROUPE: ${{ vars.AZURE_RESOURCE_GROUP }}
          NOM_APP: ${{ vars.AZURE_CONTAINERAPP || 'peroche-now' }}
          MOT_DE_PASSE_SQL: ${{ secrets.SQL_MOT_DE_PASSE }}
          JETON_GHCR: ${{ secrets.GHCR_JETON_LECTURE }}
          DOMAINE: ${{ vars.DOMAINE }}
          ID_CERTIFICAT: ${{ vars.ID_CERTIFICAT }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          az deployment group create \
            --resource-group "$GROUPE" \
            --name "peroche-now-${GITHUB_RUN_NUMBER}" \
            --template-file infra/main.bicep \
            --parameters \
              nomApp="$NOM_APP" \
              image="$image" \
              motDePasseSql="$MOT_DE_PASSE_SQL" \
              utilisateurGhcr="${GITHUB_REPOSITORY_OWNER,,}" \
              jetonGhcr="$JETON_GHCR" \
              domainePersonnalise="$DOMAINE" \
              idCertificat="$ID_CERTIFICAT" \
            --query "properties.outputs" -o json
