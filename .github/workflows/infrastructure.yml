name: Infrastructure

# Crée ou met à jour les ressources Azure décrites dans infra/main.bicep.
# À lancer à la main : la première fois, puis à chaque modification de l'infrastructure.
on:
  workflow_dispatch:

jobs:
  deploy:
    name: Déployer infra/main.bicep
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Déployer
        # Les noms des secrets et variables GitHub (SQL_MOT_DE_PASSE, GHCR_JETON_LECTURE, DOMAINE, ID_CERTIFICAT)
        # restent ceux déclarés dans les réglages du dépôt.
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_NAME: ${{ vars.AZURE_CONTAINERAPP || 'peroche-now' }}
          SQL_PASSWORD: ${{ secrets.SQL_MOT_DE_PASSE }}
          GHCR_TOKEN: ${{ secrets.GHCR_JETON_LECTURE }}
          CUSTOM_DOMAIN: ${{ vars.DOMAINE }}
          CERTIFICATE_ID: ${{ vars.ID_CERTIFICAT }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "peroche-now-${GITHUB_RUN_NUMBER}" \
            --template-file infra/main.bicep \
            --parameters \
              appName="$APP_NAME" \
              image="$image" \
              sqlAdminPassword="$SQL_PASSWORD" \
              ghcrUser="${GITHUB_REPOSITORY_OWNER,,}" \
              ghcrToken="$GHCR_TOKEN" \
              customDomain="$CUSTOM_DOMAIN" \
              certificateId="$CERTIFICATE_ID" \
            --query "properties.outputs" -o json
