name: Migration EF Core

# Génère une migration EF Core à partir du modèle et la pousse sur main.
# Utile quand on ne peut pas lancer « dotnet ef » en local. Le déploiement suit au prochain passage de CI/CD.
on:
  workflow_dispatch:
    inputs:
      name:
        description: "Nom de la migration, en anglais (ex. AddSectionToLines)"
        required: true

permissions:
  contents: write

jobs:
  generate:
    name: Générer la migration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Installer dotnet-ef
        run: dotnet tool install --global dotnet-ef --version "10.0.*"

      - name: Restaurer
        run: dotnet restore PerocheNow.slnx

      - name: Générer
        env:
          NAME: ${{ inputs.name }}
        run: |
          dotnet ef migrations add "$NAME" \
            --project src/PerocheNow.Infrastructure \
            --startup-project src/PerocheNow.Web \
            --output-dir Persistence/Migrations

      - name: Pousser sur main
        env:
          NAME: ${{ inputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/PerocheNow.Infrastructure/Persistence/Migrations
          git commit -m "Migration EF Core : $NAME"
          git push
